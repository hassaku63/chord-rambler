name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its run. Every push to main runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The one required check. It calls the same target as a local run (ADR-0004).
  check:
    name: required (make check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request HEAD is the merge commit; its first parent is the base.
          fetch-depth: 2
      - name: Tool versions from .tool-versions
        id: tv
        run: echo "lint=v$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # CI uses the Go the application is built with, not the runner's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.mod # module and build cache
      - name: golangci-lint binary cache
        id: lint-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.lint }}
      - name: Install golangci-lint (cache miss only)
        if: steps.lint-bin.outputs.cache-hit != 'true'
        working-directory: backend
        run: bash ../scripts/install-golangci-lint.sh "${{ steps.tv.outputs.lint }}" "$HOME/.local/golangci-lint"
      - run: echo "$HOME/.local/golangci-lint" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `make e2e` needs the Chromium of the Playwright in the lockfile (ADR-0017).
      - name: Chromium for the end-to-end checks
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make doctor
      - run: make check
      # Needs the network, so it is not part of `make check` (docs/dev/harness.md).
      - name: go.mod / go.sum are tidy
        run: make backend-deps-check
      - name: production npm dependencies have no high vulnerabilities
        run: make frontend-deps-check
      # Needs hadolint or Docker, so it is not part of `make check`; the runner has Docker.
      - name: Dockerfile lint
        run: make dockerfile-lint
      # Needs a base to compare with, so it is not part of `make check`.
      - name: PR size budget (warn over 600 lines, fail over 1000)
        if: github.event_name == 'pull_request'
        run: make pr-size PR_BASE=HEAD^1

  # Builds the two images and runs them together, as `make up` does, then
  # smoke tests the stack (ADR-0010). Not a required check: it needs Docker
  # and takes longer. The stack's logs are printed either way.
  image:
    name: image (build and smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BuildKit's build checks: rules hadolint does not have, such as
      # undefined variables and secrets in ARG or ENV. A violation fails.
      - name: Build checks
        run: |
          go_version=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          node_version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
          for target in api web; do
            docker buildx build --check --target "$target" \
              --build-arg GO_VERSION="$go_version" --build-arg NODE_VERSION="$node_version" .
          done
      - run: make up
      - run: make smoke
      - name: Stack logs
        if: always()
        run: make logs
      - name: Stop the stack
        if: always()
        run: make down
