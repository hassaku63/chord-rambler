version: 2
updates:
  # Actions are pinned to commit SHAs (docs/dev/harness.md); Dependabot moves the SHA and the version note together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # openapi-typescript needs TypeScript 5 (ADR-0008); lift this when it supports a newer major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must track the Node major in .tool-versions, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 1.6.28 and later need TypeScript 6; held at 1.6.27 while TypeScript is 5.9.
      - dependency-name: "@vitest/eslint-plugin"
        versions: [">=1.6.28"]
  # The runtime images of the Dockerfile, pinned by digest (ADR-0010). The Go
  # and Node build images take their versions from .tool-versions as build
  # arguments, which Dependabot cannot resolve; .tool-versions moves them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
