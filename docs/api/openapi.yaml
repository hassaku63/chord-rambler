openapi: 3.1.0
info:
  title: chord-rambler API
  version: "1"
  description: >-
    The engine's HTTP API. This document is the contract: the server's routes
    are tested against it, and the screen's types are generated from it.
    Indentation is two spaces; the route test reads the paths by indentation.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: The server's status and version
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /progressions/readings:
    post:
      operationId: readProgression
      summary: The reading of every slot of a progression
      description: "Reads the progression in its key and answers with one reading per slot, in the order of the slots. Each label carries the kind of knowledge it rests on (basis). No sentences are returned."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Progression"
      responses:
        "200":
          description: The readings of the slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionReading"
        "400":
          description: "The body is not JSON, or does not describe a progression: a chord name or a key that cannot be read, an unknown role or content, a slot with both or neither of chord and content, a length of less than one beat, more than 256 slots, or a slot that crosses the boundary of a phrase. The detail names the slot (counted from 0). A field the contract does not have, or a value of the wrong type, is also a 400; the detail gives the place and the type expected (slots[0].beats: expected integer)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "The body is larger than 64 KiB (65536 bytes)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: "The Content-Type is not application/json (parameters such as charset are allowed)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /progressions/notes:
    post:
      operationId: getProgressionNotes
      summary: The notes that play a progression
      description: "Answers with the notes of the progression as block chords, in the order of their start, as performance.Notes gives them: the bass of each chord, then its upper voices. Slots with no chord or none chosen give no notes. Tempo and seconds are not here; the screen holds them."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Progression"
      responses:
        "200":
          description: The notes to play.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionNotes"
        "400":
          description: "The body does not describe a progression; the same failures as for the readings."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "The body is larger than 64 KiB (65536 bytes)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: "The Content-Type is not application/json (parameters such as charset are allowed)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /progressions/next-candidates:
    post:
      operationId: getNextCandidates
      summary: The candidates for a slot added after the last
      description: "Answers with the chords that may follow the last slot of the progression in a slot of the beats given, as query.NextCandidates gives them: three groups (diatonic, secondary-dominant, borrowed) in this order, each with all of its chords. The diatonic group is ordered by the catalogue of function transitions the server loads when it starts. Each label carries its basis. No sentences are returned."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextCandidatesRequest"
      responses:
        "200":
          description: The groups of candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateGroups"
        "400":
          description: "The progression cannot be read (the same failures as for the readings; a place in it is written progression.slots[0].beats), the beats are less than one, the slot would cross the boundary of a phrase, or a candidate cannot be spelt in the key (beyond a double sharp or a double flat, as in E♯ major)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "The body is larger than 64 KiB (65536 bytes)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: "The Content-Type is not application/json (parameters such as charset are allowed)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /progressions/slot-candidates:
    post:
      operationId: getSlotCandidates
      summary: The candidates for a slot to fill
      description: "Answers with the chords that may fill the slot of the progression, as query.SlotCandidates gives them: the groups and the order of the next candidates, with the slot before in place of the last slot, and in each group the candidates that fit the structural role of the slot first. A candidate replaces only the content of the slot."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotCandidatesRequest"
      responses:
        "200":
          description: The groups of candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotCandidateGroups"
        "400":
          description: "The progression cannot be read (as for the next candidates), the slot is left out or is outside 0 to the number of slots - 1, or a candidate cannot be spelt in the key."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "The body is larger than 64 KiB (65536 bytes)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: "The Content-Type is not application/json (parameters such as charset are allowed)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /variations:
    post:
      operationId: getVariations
      summary: The variations of a chord
      description: "Answers with the variations of the chord in the major key, as query.Variations gives them: the fixed list for the quality of its triad, on the root of the chord and with no bass. The bass of the chord is not looked at."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariationsRequest"
      responses:
        "200":
          description: The variations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variations"
        "400":
          description: "The key or the chord cannot be read, the chord has no major, minor or diminished triad (a sus chord, a power chord, an augmented triad), or a variation cannot be spelt (beyond a double sharp or a double flat, as dim7 on C♭)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "The body is larger than 64 KiB (65536 bytes)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: "The Content-Type is not application/json (parameters such as charset are allowed)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The build's version (a git description, or "dev").
    Progression:
      type: object
      description: "A progression in a major key, in 4/4. Phrases are cut every four bars from the start; no slot may cross the boundary of a phrase."
      required: [key, slots]
      properties:
        key:
          type: string
          description: "The tonic of the major key, as a note name (C, F♯, B♭; # and b are read as ♯ and ♭)."
        slots:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/Slot"
    Slot:
      type: object
      description: "One slot: either a chord (chord) or no chord (content), never both, a length in beats and an optional role."
      required: [beats]
      properties:
        chord:
          type: string
          description: "A chord name, with the aliases the notation reads (Dm7, G7(9), C/E, CM7)."
        content:
          type: string
          enum: [none, unchosen]
          description: "A slot with no chord: none sounds nothing, unchosen has no chord chosen yet."
        beats:
          type: integer
          minimum: 1
        role:
          $ref: "#/components/schemas/Role"
    Role:
      type: string
      description: "One of the six structural roles (stable, link, prepare, rise, resolve, close) or the four colour roles (spread, float, wistful, linger)."
      enum: [stable, link, prepare, rise, resolve, close, spread, float, wistful, linger]
    Basis:
      type: string
      description: The kind of knowledge a label rests on.
      enum: [definition, computation, school, convention]
    ProgressionReading:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          description: One reading per slot, in the order of the slots.
          items:
            $ref: "#/components/schemas/SlotReading"
    SlotReading:
      type: object
      description: "The labels of one slot. A slot with no chord, or none chosen yet, has only the role fit, if any."
      properties:
        chord:
          $ref: "#/components/schemas/ChordNameLabel"
        roman:
          $ref: "#/components/schemas/RomanLabel"
        reading:
          $ref: "#/components/schemas/ChordReadingLabel"
        resolution:
          $ref: "#/components/schemas/ResolutionLabel"
        cadence:
          $ref: "#/components/schemas/CadenceLabel"
        tensionCautions:
          $ref: "#/components/schemas/TensionCautionsLabel"
        roleFit:
          $ref: "#/components/schemas/RoleFitLabel"
    ChordNameLabel:
      type: object
      description: The chord of the slot, written with its spelling kept.
      required: [basis, name]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        name:
          type: string
    RomanLabel:
      type: object
      description: "The chord seen from the tonic, as a Roman numeral (ii7, ♭VII, V7/V). The bass is not written. Absent when the root has no position in the key. The basis is school for a secondary dominant, whose target is a reading, and computation otherwise."
      required: [basis, numeral]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        numeral:
          type: string
    ChordReadingLabel:
      type: object
      description: The main reading of the chord in the key.
      required: [basis, kind, function, modes, fromParallelMinor]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        kind:
          type: string
          enum: [facts-only, diatonic, borrowed, secondary-dominant]
        function:
          type: string
          description: Set for a diatonic chord only; none otherwise.
          enum: [none, tonic, subdominant, dominant]
        modes:
          type: array
          description: "The parallel modes a borrowed chord is borrowed from; empty for the other kinds."
          items:
            $ref: "#/components/schemas/Mode"
        fromParallelMinor:
          type: boolean
          description: Whether a borrowed chord comes from the parallel minor (its modes hold aeolian).
        target:
          type: integer
          minimum: 2
          maximum: 6
          description: The degree a secondary dominant points to; absent for the other kinds.
    Mode:
      type: string
      enum: [ionian, dorian, phrygian, lydian, mixolydian, aeolian, locrian]
    ResolutionLabel:
      type: object
      description: How the chord goes on to the chord of the next slot.
      required: [basis, resolution]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        resolution:
          type: string
          enum: [none, expected, irregular]
    CadenceLabel:
      type: object
      description: The cadence named on the last slot of a full phrase; none elsewhere.
      required: [basis, cadence]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        cadence:
          type: string
          enum: [none, authentic, half, plagal, deceptive]
    TensionCautionsLabel:
      type: object
      description: The tensions of the chord that tend to sound muddy in the key, from the lowest.
      required: [basis, cautions]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        cautions:
          type: array
          items:
            $ref: "#/components/schemas/TensionCaution"
    TensionCaution:
      type: object
      description: "A tension and the note of the chord a half step below it, each as an interval above the root: a quality (P, M, m, A, d) and a number (P11 over M3)."
      required: [tension, chordTone]
      properties:
        tension:
          type: string
        chordTone:
          type: string
    RoleFitLabel:
      type: object
      description: "Whether the slot fits its structural role. Absent for a slot with no role or a colour role."
      required: [basis, fit]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        fit:
          type: string
          enum: [fits, misfits, undecided]
    ProgressionNotes:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          description: The notes, in the order of their start.
          items:
            $ref: "#/components/schemas/Note"
    Note:
      type: object
      required: [pitch, start, beats, velocity]
      properties:
        pitch:
          type: integer
          description: The MIDI note number (C4 = 60).
        start:
          type: integer
          description: The beat the note starts on, counted from 0 at the start of the progression.
        beats:
          type: integer
          description: The length of the note in beats.
        velocity:
          type: integer
          description: The velocity, 0 to 127.
    NextCandidatesRequest:
      type: object
      required: [progression, beats]
      properties:
        progression:
          $ref: "#/components/schemas/Progression"
        beats:
          type: integer
          minimum: 1
          description: "The length of the slot the candidate goes in. A slot that would cross the boundary of a phrase is cut by the screen to the beats left in the phrase; the cadence depends on the length."
    SlotCandidatesRequest:
      type: object
      required: [progression, slot]
      properties:
        progression:
          $ref: "#/components/schemas/Progression"
        slot:
          type: integer
          minimum: 0
          description: The slot to fill, counted from 0.
    VariationsRequest:
      type: object
      required: [key, chord]
      properties:
        key:
          type: string
          description: The tonic of the major key, as in Progression.
        chord:
          type: string
          description: A chord name, as in Slot.
    CandidateGroups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          description: "The groups in order: diatonic, secondary-dominant, borrowed."
          items:
            type: object
            required: [kind, candidates]
            properties:
              kind:
                $ref: "#/components/schemas/CandidateKind"
              candidates:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    SlotCandidateGroups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          description: "The groups in order: diatonic, secondary-dominant, borrowed."
          items:
            type: object
            required: [kind, candidates]
            properties:
              kind:
                $ref: "#/components/schemas/CandidateKind"
              candidates:
                type: array
                items:
                  $ref: "#/components/schemas/SlotCandidate"
    CandidateKind:
      type: string
      description: The kind every candidate of the group is read as.
      enum: [diatonic, secondary-dominant, borrowed]
    Candidate:
      type: object
      description: "A chord that may go in the slot, with the labels of the progression with it placed. A label that does not apply is absent. The slot before is the last slot for the next candidates."
      required: [chord, roman, reading]
      properties:
        chord:
          $ref: "#/components/schemas/ChordNameLabel"
        roman:
          $ref: "#/components/schemas/RomanLabel"
        reading:
          $ref: "#/components/schemas/ChordReadingLabel"
        rootMotion:
          $ref: "#/components/schemas/RootMotionLabel"
        commonTones:
          $ref: "#/components/schemas/CommonTonesLabel"
        resolution:
          description: "How the chord of the slot before goes on to the candidate (not from the candidate, as in the readings). Present when the slot before holds a chord."
          allOf:
            - $ref: "#/components/schemas/ResolutionLabel"
        cadence:
          description: The cadence of the candidate's slot. Present when that slot is the last of a full phrase.
          allOf:
            - $ref: "#/components/schemas/CadenceLabel"
        preference:
          $ref: "#/components/schemas/PreferenceLabel"
    SlotCandidate:
      description: The labels of a Candidate, and those that look at the next slot and at the role of the slot.
      allOf:
        - $ref: "#/components/schemas/Candidate"
        - type: object
          properties:
            nextResolution:
              description: How the candidate goes on to the next slot. Present when the next slot holds a chord.
              allOf:
                - $ref: "#/components/schemas/ResolutionLabel"
            nextCadence:
              description: The cadence of the next slot. Present when it is the last of a full phrase, chosen or not.
              allOf:
                - $ref: "#/components/schemas/CadenceLabel"
            roleFit:
              $ref: "#/components/schemas/CandidateRoleFitLabel"
    RootMotionLabel:
      type: object
      description: "The interval up from the root of the chord of the slot before to the root of the candidate, written as in TensionCaution (P4). Absent when the slot before holds no chord or the two roots have no interval."
      required: [basis, interval]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        interval:
          type: string
    CommonTonesLabel:
      type: object
      description: How many pitch classes sound in both the chord of the slot before and the candidate. Absent when the slot before holds no chord.
      required: [basis, count]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        count:
          type: integer
          minimum: 0
    PreferenceLabel:
      type: object
      description: "How often the catalogue says the function of the slot before moves to the function of the candidate, and the style it limits that to. A preference of the move between the functions, not of the chord. Given to a diatonic candidate when the preference orders the group and is common or less-common."
      required: [basis, from, to, preference, style]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        from:
          type: string
          enum: [tonic, subdominant, dominant]
        to:
          type: string
          enum: [tonic, subdominant, dominant]
        preference:
          type: string
          description: A label holds common or less-common; unstated (the source says nothing of how often) orders the group but gives no label.
          enum: [common, less-common, unstated]
        style:
          type: string
          enum: [classical]
    CandidateRoleFitLabel:
      type: object
      description: "Whether the candidate fits the structural role of the slot, and the conditions of the role it does not meet. Absent for a slot with no role or a colour role."
      required: [basis, fit, unmet]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        fit:
          type: string
          enum: [fits, misfits, undecided]
        unmet:
          type: array
          description: "The conditions not met, in this order, when fit is misfits; empty otherwise (docs/architecture/theory-conventions.md, 7)."
          items:
            $ref: "#/components/schemas/RoleCondition"
    RoleCondition:
      type: string
      description: "A condition of the rule of a structural role: the shape (a triad with a third or a seventh chord), the function, the previous slot is V, the next slot is a dominant, a cadence is named, another root than the previous slot, V on the previous slot resolves as expected."
      enum: [shape, function, previous-v, next-dominant, cadence, another-root, expected-resolution]
    Variations:
      type: object
      required: [variations]
      properties:
        variations:
          type: array
          description: The variations, in the order of the list for the quality of the triad.
          items:
            $ref: "#/components/schemas/Variation"
    Variation:
      type: object
      description: A chord on the same root, with no bass, whose sixth, seventh, sus or tension differs, and its labels.
      required: [chord, isInput, members, reading, tensionCautions, outOfKey]
      properties:
        chord:
          $ref: "#/components/schemas/ChordNameLabel"
        isInput:
          type: boolean
          description: Whether the variation is the chord asked about itself, bass included.
        members:
          $ref: "#/components/schemas/NotesLabel"
        reading:
          $ref: "#/components/schemas/ChordReadingLabel"
        tensionCautions:
          $ref: "#/components/schemas/TensionCautionsLabel"
        outOfKey:
          $ref: "#/components/schemas/NotesLabel"
    NotesLabel:
      type: object
      description: "Note names with their spelling: the members of a chord from the root (definition), or the members outside the scale of the key (computation; empty when none)."
      required: [basis, notes]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        notes:
          type: array
          items:
            type: string
    Problem:
      type: object
      description: A problem document (RFC 9457).
      required: [title, status]
      properties:
        title:
          type: string
          description: A short summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: An explanation specific to this occurrence.
        slot:
          type: integer
          minimum: 0
          description: "The slot the problem is in, counted from 0. Present only when the problem is in one slot; the detail also names it, for a person to read."
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
